description: NXP MW320 GPIO controller
compatible: "nxp,mw320-gpio"
include: [gpio-controller.yaml, base.yaml]
properties:
  reg:
    required: true
  interrupts:
    required: true
  "#gpio-cells":
    const: 2
  port:
    type: int
    required: true
  ngpios:
    type: int
    default: 32
gpio-cells:
  - pin
  - flags
