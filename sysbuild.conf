SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_DIRECT_XIP_WITH_REVERT=y
# App is linked at a fixed address and XIP'd from either slot via the
# MW320 flash controller FAOFFR translation, so no slot1 variant image is needed.
SB_CONFIG_MCUBOOT_DIRECT_XIP_GENERATE_VARIANT=n
SB_CONFIG_BUILD_NATIVE_SIM=y
