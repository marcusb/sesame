<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesame Logs</title>
<style>
  :root {
    --bg: #121212;
    --toolbar-bg: #1e1e1e;
    --border: #333333;
    --text: #cccccc;
    --text-dim: #888888;
    --badge-live-bg: #0f391e;
    --badge-live-fg: #4ade80;
    --badge-disc-bg: #451a1a;
    --badge-disc-fg: #f87171;
    --badge-wait-bg: #422006;
    --badge-wait-fg: #facc15;
    --btn-bg: #2d2d2d;
    --btn-hover: #3d3d3d;
    --log-bg: #181818;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h1 { font-size: 16px; font-weight: 600; color: #fff; }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .badge-live { background: var(--badge-live-bg); color: var(--badge-live-fg); }
  .badge-disc { background: var(--badge-disc-bg); color: var(--badge-disc-fg); }
  .badge-wait { background: var(--badge-wait-bg); color: var(--badge-wait-fg); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  input[type="text"] {
    background: #252525;
    border: 1px solid var(--border);
    color: #fff;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 13px;
    outline: none;
    width: 160px;
  }
  input[type="text"]:focus { border-color: #3b82f6; }
  button, .link-btn {
    background: var(--btn-bg);
    color: #eee;
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  button:hover, .link-btn:hover { background: var(--btn-hover); color: #fff; }
  .toggle-label {
    font-size: 12px;
    color: var(--text-dim);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
  }
  #log-container {
    flex: 1;
    overflow-y: auto;
    background: var(--log-bg);
    padding: 12px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-line { display: block; }
  .log-err { color: #f87171; }
  .log-wrn { color: #fbbf24; }
  .log-inf { color: #60a5fa; }
  .log-dbg { color: #9ca3af; }
  footer {
    background: var(--toolbar-bg);
    border-top: 1px solid var(--border);
    padding: 4px 16px;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<header>
  <div class="title-group">
    <h1>Sesame Logs</h1>
    <span id="status-badge" class="badge badge-wait"><span class="dot"></span>Connecting...</span>
  </div>
  <div class="toolbar">
    <input type="text" id="filter-input" placeholder="Filter logs...">
    <label class="toggle-label"><input type="checkbox" id="autoscroll-chk" checked> Auto-scroll</label>
    <button id="pause-btn">Pause</button>
    <button id="clear-btn">Clear</button>
    <button id="download-btn">Download</button>
    <a href="/matter" class="link-btn">Matter Setup</a>
  </div>
</header>
<div id="log-container"></div>
<footer>
  <span id="line-count">0 lines</span>
  <span id="port-info">WS: :8080/ws/logs | HTTP: /logs</span>
</footer>
<script>
(function() {
  const container = document.getElementById('log-container');
  const statusBadge = document.getElementById('status-badge');
  const filterInput = document.getElementById('filter-input');
  const autoscrollChk = document.getElementById('autoscroll-chk');
  const pauseBtn = document.getElementById('pause-btn');
  const clearBtn = document.getElementById('clear-btn');
  const downloadBtn = document.getElementById('download-btn');
  const lineCountSpan = document.getElementById('line-count');

  let allLines = [];
  let isPaused = false;
  let totalLineCount = 0;
  let ws = null;
  let reconnectTimer = null;

  function setStatus(type, text) {
    statusBadge.className = 'badge badge-' + type;
    statusBadge.innerHTML = '<span class="dot"></span>' + text;
  }

  function renderLine(text) {
    const div = document.createElement('span');
    div.className = 'log-line';
    if (text.includes('[ERR]') || text.includes('<err>')) div.classList.add('log-err');
    else if (text.includes('[WRN]') || text.includes('<wrn>')) div.classList.add('log-wrn');
    else if (text.includes('[INF]') || text.includes('<inf>')) div.classList.add('log-inf');
    else if (text.includes('[DBG]') || text.includes('<dbg>')) div.classList.add('log-dbg');
    div.textContent = text;
    return div;
  }

  function appendChunk(chunk) {
    const lines = chunk.split('\n');
    const filter = filterInput.value.toLowerCase();
    const shouldScroll = autoscrollChk.checked;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line && i === lines.length - 1) continue;
      allLines.push(line);
      totalLineCount++;
      if (!isPaused) {
        if (!filter || line.toLowerCase().includes(filter)) {
          container.appendChild(renderLine(line + '\n'));
        }
      }
    }

    lineCountSpan.textContent = totalLineCount + ' lines';

    if (shouldScroll && !isPaused) {
      container.scrollTop = container.scrollHeight;
    }
  }

  function refilter() {
    container.innerHTML = '';
    const filter = filterInput.value.toLowerCase();
    for (let i = 0; i < allLines.length; i++) {
      const line = allLines[i];
      if (!filter || line.toLowerCase().includes(filter)) {
        container.appendChild(renderLine(line + '\n'));
      }
    }
    if (autoscrollChk.checked) {
      container.scrollTop = container.scrollHeight;
    }
  }

  filterInput.addEventListener('input', refilter);

  clearBtn.addEventListener('click', function() {
    allLines = [];
    totalLineCount = 0;
    container.innerHTML = '';
    lineCountSpan.textContent = '0 lines';
  });

  pauseBtn.addEventListener('click', function() {
    isPaused = !isPaused;
    pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
    if (!isPaused) refilter();
  });

  downloadBtn.addEventListener('click', function() {
    const blob = new Blob([allLines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sesame.log';
    a.click();
    URL.revokeObjectURL(url);
  });

  function connectWs() {
    if (reconnectTimer) clearTimeout(reconnectTimer);
    const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/logs';
    try {
      ws = new WebSocket(wsUrl);
    } catch(e) {
      fallbackHttp();
      return;
    }

    ws.onopen = function() {
      setStatus('live', 'Live');
    };

    ws.onmessage = function(evt) {
      if (typeof evt.data === 'string') {
        appendChunk(evt.data);
      }
    };

    ws.onclose = function() {
      setStatus('disc', 'Disconnected');
      reconnectTimer = setTimeout(connectWs, 2000);
    };

    ws.onerror = function() {
      setStatus('disc', 'Error');
      ws.close();
    };
  }

  function fallbackHttp() {
    fetch('/logs')
      .then(function(res) { return res.text(); })
      .then(function(data) {
        appendChunk(data);
        setStatus('disc', 'Snapshot');
      })
      .catch(function(err) {
        setStatus('disc', 'Error');
      });
  }

  connectWs();
})();
</script>
</body>
</html>
